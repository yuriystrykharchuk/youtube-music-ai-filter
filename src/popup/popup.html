<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n-title="extName">YTM AI Filter</title>
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup">
  <header class="head">
    <div class="brand">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121214" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </div>
      <div class="brand-text">
        <strong>YTM AI Filter</strong>
        <span id="statusText" class="muted"></span>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled" data-i18n-aria="toggleFilter">
      <span class="track"></span>
    </label>
  </header>

  <section class="sec">
    <span class="eyebrow" data-i18n="nowPlaying"></span>
    <div class="now" id="now">
      <div class="now-row">
        <div class="art" aria-hidden="true"></div>
        <div class="now-text">
          <span id="trackTitle" class="track-title"></span>
          <span id="trackArtist" class="muted"></span>
        </div>
      </div>
      <div class="now-row between">
        <span id="labelBadge" class="badge" hidden></span>
        <span id="trackStatus" class="muted small"></span>
      </div>
    </div>
    <div class="grid2">
      <button class="btn" id="blockBtn" data-i18n="blockArtist"></button>
      <button class="btn" id="notAiBtn" data-i18n="notAi"></button>
    </div>
  </section>

  <section class="sec">
    <span class="eyebrow" data-i18n="stats"></span>
    <div class="grid3">
      <div class="stat"><span id="statToday" class="num">0</span><span class="muted small" data-i18n="skippedToday"></span></div>
      <div class="stat"><span id="statTotal" class="num">0</span><span class="muted small" data-i18n="skippedTotal"></span></div>
      <div class="stat"><span id="statBlocked" class="num">0</span><span class="muted small" data-i18n="artistsBlocked"></span></div>
    </div>
  </section>

  <section class="sec">
    <span class="eyebrow" data-i18n="activeRules"></span>
    <div id="rules" class="chips"></div>
  </section>

  <footer class="foot">
    <a href="#" id="openOptions" data-i18n="openSettings"></a>
    <span class="dim small" id="version"></span>
  </footer>
</div>
<script src="../shared/i18n.js"></script>
<script src="../shared/detect.js"></script>
<script src="../shared/settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
